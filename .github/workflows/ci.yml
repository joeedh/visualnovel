# The checks, on every push and every pull request. `master` is claimed to be green at every
# commit; this is the machine that verifies it rather than the convention that asks for it.
name: CI

on:
  push:
  pull_request:

# A branch pushed twice in a minute does not need the first run's answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # `submodules: recursive` is not optional here. `vendor/path.ux` is a submodule that
      # carries one of its own, the renderer compiles path.ux from source, and `pnpm check`
      # typechecks the renderer — so without this every run fails a long way from its cause.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # No version pinned here: the action reads `packageManager` from package.json, so the
      # pin lives in one place and CI cannot drift from a local install.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # path.ux is a project of its own, with its own lockfile, and it is not a workspace member —
      # so the root install does not reach it and `nstructjs`, which
      # `path-controller/util/nstructjs.ts` re-exports, resolves to nothing. Locally this is
      # invisible: anyone who has ever built path.ux has its `node_modules` on disk already. On a
      # clean checkout it surfaces as scores of "has no exported member" errors *inside* `vendor/`,
      # which name the symbol rather than the install that is missing.
      - run: pnpm --dir vendor/path.ux install --frozen-lockfile

      # Three steps rather than one chained command, so a failure names the gate that failed
      # without anyone reading the log. `pnpm check` — not a bare `tsgo` — because it is two
      # passes, and the second is the only thing that typechecks `renderer/**`.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm lint

  # Separate from `check` on purpose, and for two reasons. It is the one gate that can fail
  # because of somebody else's outage rather than this commit, so it should be readable as a
  # distinct red tick and not as "the tests broke". And it is the only job here that does not
  # need `vendor/path.ux`: nothing it touches is compiled through the renderer, so it keeps
  # working whatever state the submodule is in.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blocking, because a dead link in the instructions a new user follows is a shipped bug and
      # the verdict is unambiguous. The soft half of this audit — whether the words around the
      # link are still true — is tier 2, and deliberately never fails a build.
      - run: pnpm check:keylinks
