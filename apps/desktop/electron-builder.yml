# What ships, and what deliberately does not. Read `files` first — it is the whole answer to
# "why is the installer the size it is". Config lives here rather than in package.json because
# it carries comments, and because the `files` list is the part someone will need to read.
appId: dev.joeedh.vnstudio
productName: vnstudio

# The file on disk has to be spelt exactly as `latest.yml` spells it, and the default is not:
# electron-builder names the installer `vnstudio Setup 0.1.0.exe` but writes the URL-safe
# `vnstudio-Setup-0.1.0.exe` into the update feed. That mismatch is invisible until an update
# check 404s months later, so the name is stated once here and both sides read it.
artifactName: ${productName}-Setup-${version}.${ext}

directories:
  # electron-builder is pointed at a scratch project tree built by `scripts/package.desktop.mjs`
  # (a hoisted install, so pnpm's symlink farm never reaches the app image), so this climbs back
  # out of it to the app it was made from.
  output: ../release

# esbuild and Vite bundle every `@vn/*` package, `nstructjs` and the whole of path.ux into
# `dist/`. `scripts/aliases.mjs` declares only four externals, one of which is Electron itself,
# so the two model SDKs and esbuild are the entire runtime dependency tree. This list is explicit
# rather than a default glob because the exclusion below is the kind of thing a default would ship.
files:
  - dist/**
  - package.json
  # A tsgo artifact that happens to live in the same `dist/` as the runtime files: declarations
  # so `renderer/tsconfig.json` has something to check path.ux against. Never runtime.
  - '!dist/pathux-types/**'

# `docs/guides/api-keys.md` is the Setup pane's single source, and it is markdown outside `apps/desktop`.
# `resourcePath()` looks under `process.resourcesPath` first in a packaged build, so this `to:`
# and the `readResource('docs', 'guides', 'api-keys.md')` call have to keep saying the same thing.
extraResources:
  - from: docs/guides/api-keys.md
    to: docs/guides/api-keys.md
  # The debug agent reads this app's own source to explain a bad conversation, so an install ships
  # it: `sourceRoot()` in `@vn/agentreport` looks under `process.resourcesPath` for a directory
  # spelt exactly this way, and `scripts/package.desktop.mjs` fills it with that package's own
  # `READABLE` manifest. Unpacked rather than in the asar because the read tools use plain `fs`.
  - from: source
    to: source

asar: true

# esbuild builds a generation plugin, and it does that work in a binary it spawns rather than in
# JavaScript. It finds that binary by a path relative to its own file, so a copy left inside the
# asar resolves as a module and then fails on the first plugin install. The platform package
# (`@esbuild/win32-x64` and its siblings) is where the binary itself lives.
#
# The two model SDKs stay packed, and the machine's own `git` was never in the image to begin
# with, so this is the only executable the app spawns from beside itself. `pnpm smoke` runs a
# transform in the built binary, which is what catches a regression here.
asarUnpack:
  - node_modules/esbuild/**
  - node_modules/@esbuild/**

win:
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # API keys — and anything a settings system later adds — live in `userConfigDir()`
  # (`%LOCALAPPDATA%\vnauthor`), which is neither the app's userData nor ours to delete. Both
  # survive an uninstall on purpose, so reinstalling does not ask again for a key already given.
  deleteAppDataOnUninstall: false

# electron-updater reads `latest.yml`, and electron-builder emits it only when it knows where
# releases live. Publishing stays a human act even so: local runs pass `--publish never`, and the
# release workflow uploads to a draft.
publish:
  provider: github
  owner: joeedh
  repo: visualnovel
